[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-qbo"
version = "0.1.0"
description = "Convert one checking-account CSV to a QBO statement with a supplied ledger balance; QuickBooks import unverified."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Zijian Xiao"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["csv_to_qbo*"]
